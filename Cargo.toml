[package]
name = "ahl-core"
version = "0.3.1"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Core library and test vectors for AHL Protocol (Anchored History Log)"
repository = "https://github.com/evidentum-io/ahl-core"
readme = "README.md"
categories = ["cryptography", "data-structures"]
keywords = ["provenance", "transparency-log", "merkle-tree", "test-vectors"]

[features]
default = []
# A seam for the fuzz harness in `fuzz/`, and nothing else: it exposes the governance-statement
# schema validation the I-D §7.5.1 walk runs, so a fuzz target can reach it directly. Reaching
# it through a receipt is not possible for arbitrary bytes — §7.5 step 3 verifies each chain
# hop's inclusion path against the checkpoint root before the walk runs, so any edit to a
# carried payload is rejected as an unanchored hop long before its schema is read. Off by
# default; the API it adds carries no stability promise.
fuzzing = []

[dependencies]
# Anti-drift: JCS canonicalization, RFC 6962-style node hashing, and - normatively -
# inclusion-proof verification come from the audited sibling implementation, pinned by rev.
atl-core = { git = "https://github.com/evidentum-io/atl-core", rev = "79ac9c085857", default-features = false }
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
thiserror = "1"
# Every RFC 3339 value in the crate - `valid_time`, `effective_from`, checkpoint times - is
# parsed and compared through this one datetime type. String comparison is never used.
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# `syn` resolves to both 2.x and 3.x: `serde_derive` has moved to syn 3, while `thiserror` 1.x
# still uses syn 2 — and `thiserror` 1.x arrives both directly and through `atl-core`, which is
# a read-only sibling pinned by revision. Nothing in this crate can reconcile that, so the lint
# is allowed here, visibly, rather than left as a standing CI failure. Revisit when the pinned
# `atl-core` revision moves to `thiserror` 2.
multiple_crate_versions = "allow"
# No-panic policy: library code reaches no panicking construct on any input. Every one of
# these is a way a library function could abort the caller's process instead of returning a
# rejection, so they are denied crate-wide and satisfied in code rather than allowed at a
# site. Test modules, the integration tests and the vector generator allow them back at
# module level: an assertion that fires IS the failure report there.
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
missing_panics_doc = "deny"
